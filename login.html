<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - Saathwik's Book House</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="logo">Saathwik's <span>Book House</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="catalog.html">Catalog</a>
        <a href="cart.html">Cart <span class="badge" id="cart-count">0</span></a>
        <a href="profile.html">Profile</a>
        <a href="registration.html" id="register-link">Register</a>
        <a href="login.html" id="login-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h1>Login</h1>
      <form onsubmit="login(); return false;">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="text" id="email">
          <p class="error" id="emailError"></p>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password">
          <p class="error" id="passwordError"></p>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p class="form-link">New here? <a href="registration.html">Create an account</a></p>
    </div>
  </main>
</body>
</html>
